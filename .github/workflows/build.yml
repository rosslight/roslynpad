name: Build and publish editor packages

on:
  push:
    branches: [main]
    tags: ['packages/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Select package version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/packages/v* ]]; then
            version="${GITHUB_REF_NAME#packages/v}"
          else
            version="5.9.0-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and pack the complete editor stack
        run: |
          for project in Morgania.Editor.Abstractions Morgania.Editor Morgania.CodeAnalysis.EditorFeatures Morgania.CodeAnalysis.Editor RoslynPad.Themes; do
            dotnet pack "src/$project/$project.csproj" --configuration Release --output artifacts/packages \
              -nodeReuse:false -maxcpucount:1 /p:UseSharedCompilation=false \
              /p:Version="$PACKAGE_VERSION" /p:RepositoryUrl=https://github.com/rosslight/roslynpad \
              /p:PackageProjectUrl=https://github.com/rosslight/roslynpad
          done
      - name: Test editor behavior and composition
        run: |
          for project in Morgania.CompositionTests Morgania.GeometryTests Morgania.BehaviorTests Morgania.IntellisenseTests; do
            dotnet build "tests/$project/$project.csproj" --configuration Release \
              -nodeReuse:false -maxcpucount:1 /p:UseSharedCompilation=false /p:Version="$PACKAGE_VERSION"
            for framework in net10.0 net11.0; do
              assembly="tests/$project/bin/Release/$framework/$project.dll"
              if [[ "$project" == Morgania.IntellisenseTests ]]; then
                # These tests share a static UI/JTF host and depend on test order when run in one process.
                # Run every discovered case with a fresh headless host; do not skip or retry failures.
                dotnet "$assembly" --list-tests json > artifacts/intellisense-tests.json
                jq -er '.tests[].uid' artifacts/intellisense-tests.json > artifacts/intellisense-test-ids.txt
                mapfile -t test_ids < artifacts/intellisense-test-ids.txt
                (( ${#test_ids[@]} > 0 ))
                for test in "${test_ids[@]}"; do
                  dotnet "$assembly" --filter-uid "$test"
                done
              else
                dotnet "$assembly"
              fi
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: editor-packages
          path: artifacts/packages/*
      - name: Publish to Rosslight GitHub Packages
        if: github.repository == 'rosslight/roslynpad' && startsWith(github.ref, 'refs/tags/packages/v')
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/rosslight/index.json --name rosslight \
            --username "$GITHUB_ACTOR" --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text
          dotnet nuget push 'artifacts/packages/*.nupkg' --source rosslight \
            --api-key "$GH_PACKAGES_TOKEN" --no-symbols
